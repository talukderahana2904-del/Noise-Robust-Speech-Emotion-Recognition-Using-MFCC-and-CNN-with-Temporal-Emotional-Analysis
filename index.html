<!DOCTYPE html>
<html>

<head>
    <title>Emotion AI</title>
    <style>
        body {
            background: radial-gradient(circle at top, #0f2027, #000);
            color: white;
            font-family: 'Segoe UI';
            text-align: center;
        }

        .container {
            margin-top: 120px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            display: inline-block;
        }

        button {
            background: #00ffc3;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <h1>🎤 Emotion Recognition AI</h1>
            <p>Upload speech to analyze emotions</p>

            <form action="/predict" method="post" enctype="multipart/form-data">
                <input type="file" name="file" required><br><br>
                <button>Analyze</button>
            </form>
        </div>
    </div>

</body>

</html>
